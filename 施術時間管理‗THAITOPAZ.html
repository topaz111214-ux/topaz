<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thai Topaz">
<title>Thai Topaz｜時間計算・施術タイマー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#e8e8ed;font-family:-apple-system,'Hiragino Sans','Noto Sans JP','Segoe UI',sans-serif;color:#1c1c1e}

/* 全体ラッパー */
.outer{display:flex;justify-content:center;align-items:flex-start;min-height:100%;background:#e8e8ed;padding:0}
.app{width:100%;max-width:440px;min-height:100vh;background:#f2f2f7;display:flex;flex-direction:column;padding:8px;gap:8px;position:relative}

/* ヘッダー */
.hdr{background:#1a6fa8;border-radius:10px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-left{display:flex;align-items:center;gap:8px}
.hdr-t{font-size:17px;font-weight:700;color:#fff}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-c{font-size:15px;color:rgba(255,255,255,.9);font-variant-numeric:tabular-nums}

/* 言語切り替え */
.lang-switch{display:flex;background:rgba(0,0,0,.15);border-radius:6px;padding:2px;gap:2px}
.lang-btn{background:none;border:none;color:rgba(255,255,255,.8);font-size:11px;font-weight:600;padding:3px 6px;border-radius:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.lang-btn.on{background:#fff;color:#1a6fa8}

/* 歯車ボタン */
.btn-setting{background:none;border:none;cursor:pointer;color:#fff;padding:5px;border-radius:6px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:background .2s}
.btn-setting:active{background:rgba(255,255,255,.25)}
.btn-setting svg{width:18px;height:18px;stroke:currentColor}

/* レイアウトグリッド */
.main-grid{display:flex;flex-direction:column;gap:8px;flex:1}
.pane-ctrl{display:flex;flex-direction:column;gap:8px}
.pane-list{display:flex;flex-direction:column;gap:8px;flex:1}

/* タイマーエリア */
.trow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex-shrink:0}
.tc{background:#fff;border-radius:8px;padding:6px 6px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tc .lbl{font-size:11px;color:#8e8e93;white-space:nowrap}
.tc .val{font-size:18px;font-weight:600;color:#1c1c1e;font-variant-numeric:tabular-nums}
.tc.hl .val{color:#1a6fa8}

.btn-upd{width:100%;padding:12px;background:#1a6fa8;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.btn-upd:active{background:#145d8f;transform:scale(.98)}

/* 選択詳細ボックス（開閉対応） */
.res{background:#e9f7ee;border:1.5px solid #34c759;border-radius:12px;padding:10px 12px;display:none}
.res.open{display:block}
.res-hdr-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;margin-bottom:6px}
.res-lbl{font-size:12px;color:#1e7e34;font-weight:600}
.res-toggle-btn{background:rgba(52,199,89,.15);border:none;color:#1e7e34;font-size:11px;font-weight:600;cursor:pointer;padding:3px 8px;border-radius:12px;-webkit-tap-highlight-color:transparent}

.res-course{font-size:16px;font-weight:700;color:#1c1c1e;text-align:center;margin-bottom:8px}
.time-boxes{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-bottom:10px}
.tbox{background:#fff;border:1.5px solid #1a6fa8;border-radius:10px;padding:8px 6px;text-align:center}
.tbox.end{border-color:#d32f2f}
.tbox-lbl{font-size:11px;color:#8e8e93;margin-bottom:2px}
.tbox-val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:#1a6fa8}
.tbox.end .tbox-val{color:#d32f2f}
.arrow{font-size:20px;color:#8e8e93;text-align:center}

/* 5項目＋単価の価格表示 */
.res-prices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(max-width:380px){
  .res-prices{grid-template-columns:repeat(2,1fr)}
}
.rp{background:#fff;border-radius:8px;padding:6px 4px;text-align:center}
.rp-lbl{font-size:10px;color:#8e8e93;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-val{font-size:14px;font-weight:700;color:#1c1c1e}
.rp-val.hl1{color:#1565c0}
.rp-val.hl2{color:#d32f2f}
.rp-val.hl3{color:#c07000}
.rp-val.hl-unit{color:#1e7e34}
.rp-pct-badge{font-size:10px;color:#666;font-weight:400;margin-left:2px}

/* フィルター */
.filter-row{display:flex;gap:5px;overflow-x:auto;flex-shrink:0;padding-bottom:2px}
.ftab{flex-shrink:0;padding:6px 13px;border:1px solid #d1d1d6;border-radius:20px;background:#fff;font-size:13px;cursor:pointer;color:#8e8e93;-webkit-tap-highlight-color:transparent}
.ftab.on{border-color:#1a6fa8;background:#e8f2fa;color:#1a6fa8;font-weight:600}

/* 分数グループ化リスト */
.clist{background:#fff;border-radius:10px;overflow-y:auto;flex:1;box-shadow:0 1px 2px rgba(0,0,0,.06);padding:6px}
.mgroup{background:#fafafa;border:1px solid #e5e5ea;border-radius:8px;margin-bottom:6px;padding:7px 8px;display:flex;flex-direction:column;gap:5px}
.mgroup:last-child{margin-bottom:0}
.mgroup-hdr{display:flex;align-items:center;justify-content:space-between;padding-bottom:4px;border-bottom:1px dashed #e0e0e5}
.mgroup-min{font-size:14px;font-weight:700;color:#1c1c1e}
.mgroup-min span{font-size:11px;font-weight:400;color:#8e8e93}
.mgroup-times{font-size:12px;color:#636366}
.mgroup-times b{color:#1c1c1e;font-size:13px}

.mgroup-items{display:grid;grid-template-columns:repeat(auto-fit, minmax(110px, 1fr));gap:6px}
.mitem{background:#fff;border:1.5px solid #d1d1d6;border-radius:8px;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.mitem:active{background:#f0f7ff;border-color:#1a6fa8}

/* 選択されたコースのみに色がつく */
.mitem.selected{
  background: #e3f0fd;
  border-color: #1a6fa8;
  box-shadow: 0 0 0 1.5px #1a6fa8;
}

.c-badge{font-size:11px;padding:2px 6px;border-radius:4px;flex-shrink:0;font-weight:600}
.nm-thai{background:#e3f0fd;color:#1565c0}
.nm-oil{background:#fff3e0;color:#b76000}
.nm-topaz{background:#fde8ec;color:#b71c1c}
.nm-other{background:#eef1f4;color:#495057}

.mitem-pr{text-align:right}
.mitem-main{font-size:14px;font-weight:700;color:#1c1c1e}

/* PC・デスクトップ（768px以上）対応 */
@media(min-width: 768px){
  .outer{padding:24px 16px;align-items:flex-start}
  .app{max-width:980px;min-height:auto;border-radius:16px;box-shadow:0 6px 28px rgba(0,0,0,.15);padding:14px;gap:12px}
  .main-grid{display:grid;grid-template-columns:380px 1fr;gap:14px;align-items:start}
  .clist{max-height:580px}
}

/* 設定モーダル */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:999;padding:12px}
.modal-overlay.open{display:flex}
.modal-content{background:#fff;border-radius:14px;width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.25);overflow:hidden}
.modal-hdr{background:#f7f7f8;border-bottom:1px solid #e5e5ea;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-hdr h3{font-size:16px;font-weight:700;color:#1c1c1e}
.modal-close{background:none;border:none;font-size:24px;color:#8e8e93;cursor:pointer;line-height:1;padding:0 4px}
.modal-body{padding:14px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px}

.basic-cfg-box{background:#eef6fc;border:1.5px solid #b8daff;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.basic-cfg-title{font-size:13px;font-weight:700;color:#1a6fa8;display:flex;align-items:center;gap:4px}
.basic-cfg-desc{font-size:11px;color:#495057;line-height:1.4}
.basic-cfg-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px}
@media(max-width:540px){
  .basic-cfg-grid{grid-template-columns:repeat(2, 1fr)}
}
.b-field{display:flex;flex-direction:column;gap:2px}
.b-label{font-size:11px;font-weight:600;color:#495057}
.b-input{padding:6px 8px;border:1px solid #ced4da;border-radius:6px;font-size:13px;background:#fff;width:100%}
.b-input-group{display:flex;align-items:center;gap:4px}
.b-pct-wrap{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid #ced4da;border-radius:6px;padding:0 4px;width:64px;flex-shrink:0}
.b-pct-input{width:100%;border:none;outline:none;font-size:12px;text-align:right;padding:6px 0;color:#0056b3;font-weight:700}

.btn-apply-basic{background:#1a6fa8;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;align-self:flex-end;display:flex;align-items:center;gap:4px;-webkit-tap-highlight-color:transparent;transition:background .2s}
.btn-apply-basic:active{background:#12527e;transform:scale(.98)}

.cfg-sec{display:flex;flex-direction:column;gap:8px}
.cfg-sec-title{font-size:13px;font-weight:700;color:#1c1c1e}
.cfg-item{background:#f9f9fb;border:1px solid #e5e5ea;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}

.cfg-item-top{display:flex;align-items:flex-end;gap:8px}
.c-field-group{display:flex;flex-direction:column;gap:3px}
.c-field-lbl{font-size:11px;font-weight:600;color:#636366}
.c-m-wrap{display:flex;align-items:center;gap:4px}
.c-m{width:64px;font-weight:700;padding:6px;border:1px solid #d1d1d6;border-radius:6px;font-size:13px;text-align:center}
.c-name-wrap{flex:1;min-width:0}
.c-name{width:100%;padding:6px 8px;border:1px solid #d1d1d6;border-radius:6px;font-size:13px}
.btn-del{background:#ff3b30;color:#fff;border:none;border-radius:6px;padding:7px 12px;font-size:12px;cursor:pointer;flex-shrink:0;height:33px}

.cfg-item-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width: 620px){
  .cfg-item-fields{grid-template-columns:repeat(6,1fr)}
}
.cfg-field{display:flex;flex-direction:column;gap:2px;min-width:0}
.cfg-sub-lbl{font-size:10px;font-weight:600;color:#636366;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pct-input-wrap{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid #d1d1d6;border-radius:4px;padding:1px 4px;margin-bottom:2px}
.cfg-pct-input{width:100%;border:none;outline:none;font-size:11px;text-align:right;color:#0056b3;font-weight:600}
.pct-unit{font-size:10px;color:#8e8e93}
.cfg-sub-input{width:100%;min-width:0;padding:5px 6px;border:1px solid #d1d1d6;border-radius:6px;font-size:12px;text-align:right}
.cfg-sub-input.is-auto{background:#f0f7ff;color:#0056b3;font-weight:600}
.cfg-unit-val{background:#e9f7ee;border:1px solid #b7eb8f;color:#1e7e34;font-weight:700;padding:6px;border-radius:6px;font-size:12px;text-align:center;white-space:nowrap;overflow:hidden;height:31px;display:flex;align-items:center;justify-content:center}

.btn-add{background:#34c759;color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.modal-ftr{border-top:1px solid #e5e5ea;padding:12px 14px;display:flex;gap:8px;background:#f7f7f8;flex-shrink:0}
.btn-save{flex:1;padding:10px;background:#1a6fa8;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.btn-reset{padding:10px 14px;background:#8e8e93;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div class="outer">
<div class="app">
  <!-- ヘッダー -->
  <div class="hdr">
    <div class="hdr-left">
      <span class="hdr-t" id="storeNameText">Thai Topaz</span>
    </div>
    <div class="hdr-right">
      <div class="lang-switch">
        <button class="lang-btn on" id="btnLangJa" onclick="setLang('ja')">JP</button>
        <button class="lang-btn" id="btnLangEn" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btnLangTh" onclick="setLang('th')">TH</button>
      </div>
      <span class="hdr-c" id="liveTime">--:--</span>
      <button class="btn-setting" id="btnOpenSetting" title="設定" aria-label="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- メインエリア -->
  <div class="main-grid">
    <div class="pane-ctrl">
      <div class="trow">
        <div class="tc"><div class="lbl" id="lblStartTime">開始時刻</div><div class="val" id="startTime">--:--</div></div>
        <div class="tc hl"><div class="lbl" id="lblNowTime">現在時刻</div><div class="val" id="nowTime">--:--</div></div>
        <div class="tc"><div class="lbl" id="lblElapsed">経過時間</div><div class="val" id="elapsed">--分</div></div>
      </div>

      <button class="btn-upd" id="btnUpd">⏱ 更新（開始時刻をセット）</button>

      <!-- 選択詳細ボックス（開閉対応・初期非表示） -->
      <div class="res" id="res">
        <div class="res-hdr-row" onclick="toggleRes()">
          <div class="res-lbl" id="lblResTitle">✅ 選択コース詳細</div>
          <button type="button" class="res-toggle-btn" id="btnToggleRes">▲ 閉じる</button>
        </div>
        <div id="resBody">
          <div class="res-course" id="rC">--</div>
          <div class="time-boxes">
            <div class="tbox">
              <div class="tbox-lbl" id="lblRStart">開始時刻</div>
              <div class="tbox-val" id="rStart">--:--</div>
            </div>
            <div class="arrow">→</div>
            <div class="tbox end">
              <div class="tbox-lbl" id="lblREnd">終了時刻</div>
              <div class="tbox-val" id="rEnd">--:--</div>
            </div>
          </div>
          <div class="res-prices" id="resPrices"></div>
        </div>
      </div>
    </div>

    <!-- 右側：コース一覧（分数グループ化レイアウト） -->
    <div class="pane-list">
      <div class="filter-row" id="filterRow"></div>
      <div class="clist" id="clist"></div>
    </div>
  </div>
</div>
</div>

<!-- 設定モーダル -->
<div class="modal-overlay" id="settingModal">
  <div class="modal-content">
    <div class="modal-hdr">
      <h3 id="lblSettingHdr">⚙️ 設定（基本設定・コース一覧）</h3>
      <button class="modal-close" id="btnCloseSetting">&times;</button>
    </div>
    <div class="modal-body">
      <!-- 基本設定枠 -->
      <div class="basic-cfg-box">
        <div class="basic-cfg-title">📌 <span id="lblBasicCfgTitle">基本設定（項目名・基本％設定）</span></div>
        <div class="basic-cfg-desc" id="lblBasicDesc">※基本設定を入力後、「全コースに反映」ボタンを押すと、登録済みの全コースに自動計算で一括反映されます。</div>
        
        <div class="b-field">
          <div class="b-label" id="lblStoreLabel">店舗表示名</div>
          <input type="text" class="b-input" id="cfgStoreName" value="Thai Topaz">
        </div>
        
        <div style="font-size:11px;font-weight:700;color:#1a6fa8;margin-top:2px;" id="lblBasicItemHeader">金額項目の名称 ＆ 基本％（①の料金に対する割合）</div>
        <div class="basic-cfg-grid">
          <div class="b-field">
            <div class="b-label" id="lblItem1Title">項目1（単価＆％計算元）</div>
            <input type="text" class="b-input" id="cfgLabelP1" value="基本コース料金">
          </div>
          <div class="b-field">
            <div class="b-label" id="lblItem2Title">項目2 ［名称 / ％］</div>
            <div class="b-input-group">
              <input type="text" class="b-input" id="cfgLabelP2" value="STAFF(A)">
              <div class="b-pct-wrap"><input type="number" class="b-pct-input" id="cfgPctP2" placeholder="%" step="any"><span>%</span></div>
            </div>
          </div>
          <div class="b-field">
            <div class="b-label" id="lblItem3Title">項目3 ［名称 / ％］</div>
            <div class="b-input-group">
              <input type="text" class="b-input" id="cfgLabelP3" value="STAFF(B)">
              <div class="b-pct-wrap"><input type="number" class="b-pct-input" id="cfgPctP3" placeholder="%" step="any"><span>%</span></div>
            </div>
          </div>
          <div class="b-field">
            <div class="b-label" id="lblItem4Title">項目4 ［名称 / ％］</div>
            <div class="b-input-group">
              <input type="text" class="b-input" id="cfgLabelP4" value="STAFF(C)">
              <div class="b-pct-wrap"><input type="number" class="b-pct-input" id="cfgPctP4" placeholder="%" step="any"><span>%</span></div>
            </div>
          </div>
          <div class="b-field">
            <div class="b-label" id="lblItem5Title">項目5 ［名称 / ％］</div>
            <div class="b-input-group">
              <input type="text" class="b-input" id="cfgLabelP5" value="任意⑤">
              <div class="b-pct-wrap"><input type="number" class="b-pct-input" id="cfgPctP5" placeholder="%" step="any"><span>%</span></div>
            </div>
          </div>
          <div class="b-field">
            <div class="b-label" id="lblUnitTitle">単価名称（自動計算）</div>
            <input type="text" class="b-input" id="cfgLabelUnit" value="時間単価(分)">
          </div>
        </div>

        <button type="button" class="btn-apply-basic" id="btnApplyBasic" onclick="applyBasicSettingsToAll()">
          ⚡ <span id="lblApplyBtnText">基本設定を全コースに反映</span>
        </button>
      </div>

      <!-- コース一覧編集 -->
      <div class="cfg-sec">
        <div class="cfg-sec-title" id="lblCourseEditLabel">コース一覧編集</div>
        <div id="courseEditList" style="display:flex;flex-direction:column;gap:8px"></div>
        <button class="btn-add" id="btnAddCourse">+ 新しいコースを追加</button>
      </div>
    </div>
    <div class="modal-ftr">
      <button class="btn-reset" id="btnResetSetting">初期値</button>
      <button class="btn-save" id="btnSaveSetting">保存して適用</button>
    </div>
  </div>
</div>

<script>
var I18N = {
  ja: {
    startTime: "開始時刻",
    nowTime: "現在時刻",
    elapsed: "経過時間",
    minUnit: "分",
    btnUpd: "⏱ 更新（開始時刻をセット）",
    resTitle: "✅ 選択コース詳細",
    courseLabel: "分コース ｜ ",
    endTime: "終了時刻",
    all: "すべて",
    courseTime: "コース時間",
    courseName: "コース名",
    settingHdr: "⚙️ 設定（基本設定・コース一覧）",
    basicCfgTitle: "基本設定（項目名・基本％設定）",

function getArrItem(arr, idx){
  if(!arr || !Array.isArray(arr) || idx >= arr.length) return null;
  return arr[idx];
}

// 言語に応じた適切な項目名を返す関数（デフォルト日本語の場合は各言語の翻訳に自動変換）
function getActiveLabel(key){
  var jaDef = I18N.ja.defaultLabels;
  var curDef = I18N[currentLang].defaultLabels;

  if(currentLang !== 'ja'){
    var curVal = basicLabels[key];
    // 日本語のデフォルト値のままであれば、選択言語のデフォルト値に差し替える
    if(!curVal || curVal === jaDef[key] || curVal === '基本コース料金' || curVal === 'STAFF' || curVal === 'OWNER' || curVal === 'OWNER割引' || curVal === '時間単価(分)' || curVal === '単価(分)' || curVal === '任意⑤' || curVal === 'STAFF(C)'){
      return curDef[key] || curVal;
    }
  }
  return basicLabels[key] || curDef[key] || '';
}

// 5分刻みの四捨五入（2捨3入）
function getRoundedStartTime(nowDate){
  var d = new Date(nowDate.getTime());
  d.setSeconds(0, 0);
  var m = d.getMinutes();
  var rem = m % 5;
  if(rem < 3){
    d.setMinutes(m - rem);
  } else {
    d.setMinutes(m + (5 - rem));
  }
  return d;
}

function loadSettings(){
  try{
    var savedLang = localStorage.getItem('thai_topaz_lang');
    if(savedLang && I18N[savedLang]) currentLang = savedLang;
    var savedName = localStorage.getItem('thai_topaz_store_name');
    if(savedName) storeName = savedName;
    var savedLabels = localStorage.getItem('thai_topaz_basic_labels');
    if(savedLabels){
      basicLabels = JSON.parse(savedLabels);
    }
    var savedPcts = localStorage.getItem('thai_topaz_basic_pcts');
    if(savedPcts){
      basicPcts = JSON.parse(savedPcts);
    }
    var savedCourses = localStorage.getItem('thai_topaz_courses');
    if(savedCourses){
      var parsed = JSON.parse(savedCourses);
      COURSES = parsed.map(function(c){
        var prs = (c.prices && Array.isArray(c.prices)) ? c.prices : [c.staff||0, c.own||0, null, null, null];
        while(prs.length < 5) prs.push(null);
        var pcts = (c.percents && Array.isArray(c.percents)) ? c.percents : [null, basicPcts.p2, basicPcts.p3, null, null];
        while(pcts.length < 5) pcts.push(null);
        return {
          m: parseInt(c.m) || 0,
          name: c.name || 'Thai',
          prices: prs,
          percents: pcts
        };
      });
    } else {
      COURSES = JSON.parse(JSON.stringify(DEFAULT_COURSES));
    }
  }catch(e){
    COURSES = JSON.parse(JSON.stringify(DEFAULT_COURSES));
    basicLabels = Object.assign({}, DEFAULT_LABELS);
    basicPcts = Object.assign({}, DEFAULT_BASIC_PCTS);
  }
  document.getElementById('storeNameText').textContent = storeName;
  updateLangUI();
}

  basicLabels = labels;

  localStorage.setItem('thai_topaz_store_name', storeName);
  localStorage.setItem('thai_topaz_courses', JSON.stringify(COURSES));
  localStorage.setItem('thai_topaz_basic_labels', JSON.stringify(basicLabels));
  localStorage.setItem('thai_topaz_basic_pcts', JSON.stringify(basicPcts));
  document.getElementById('storeNameText').textContent = storeName;

  render();
}

function fmt(d){return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function addM(d,m){return new Date(d.getTime()+m*60000);}

function yen(n){
  if(n === null || n === undefined || n === '' || isNaN(n)) return '—';
  return '¥' + Number(n).toLocaleString();
}

function ckey(c){return c.m+'_'+c.name;}
function nbadge(n){
  if(n==='Thai') return 'nm-thai';
  if(n==='Oil') return 'nm-oil';
  if(n==='Topaz') return 'nm-topaz';
  return 'nm-other';
}

function buildFilters(){
  var catSet = {};
  for(var i=0; i<COURSES.length; i++){
    if(COURSES[i].name) catSet[COURSES[i].name] = true;
  }
  var cats = Object.keys(catSet);
  var fRow = document.getElementById('filterRow');
  fRow.innerHTML = '';
  
  var t = I18N[currentLang];
  var allTab = document.createElement('div');
  allTab.className = 'ftab' + (currentFilter==='all'?' on':'');
  allTab.textContent = t.all;
  allTab.onclick = function(){ sf('all'); };
  fRow.appendChild(allTab);

  cats.forEach(function(cName){
    var tab = document.createElement('div');
    tab.className = 'ftab' + (currentFilter===cName?' on':'');
    tab.textContent = cName;
    tab.onclick = function(){ sf(cName); };
    fRow.appendChild(tab);
  });
}

// 金額計算
function getEffectivePrices(c){
  var p1 = 0;
  if(c && c.prices && c.prices.length > 0){
    var raw1 = getArrItem(c.prices, 0);
    p1 = (raw1 !== null && raw1 !== undefined && raw1 !== '') ? Number(raw1) : 0;
  }
  if(isNaN(p1)) p1 = 0;
  var eff = [p1];

  for(var i=1; i<=4; i++){
    var pctVal = (c.percents && c.percents.length > i) ? getArrItem(c.percents, i) : null;
    var pct = (pctVal !== null && pctVal !== undefined && pctVal !== '') ? parseFloat(pctVal) : null;
    if(pct !== null && !isNaN(pct)){
      eff.push(Math.round(p1 * (pct / 100)));
    } else {
      var rawP = (c.prices && c.prices.length > i) ? getArrItem(c.prices, i) : null;
      var numP = (rawP !== null && rawP !== undefined && rawP !== '') ? Number(rawP) : null;
      eff.push((numP !== null && !isNaN(numP)) ? numP : null);
    }
  }
  return eff;
}

// コース一覧の描画（選択されたコースのみ .selected クラスを付与）
function render(){
  var t = I18N[currentLang];
  var l = document.getElementById('clist');
  l.innerHTML = '';

  var groupsByMin = {};
  var minOrder = [];

  for(var i=0; i<COURSES.length; i++){
    var c = COURSES[i];
    if(currentFilter !== 'all' && c.name !== currentFilter) continue;
    if(!groupsByMin[c.m]){
      groupsByMin[c.m] = [];
      minOrder.push(c.m);
    }
    groupsByMin[c.m].push(c);
  }

  minOrder.sort(function(a,b){ return a - b; });

  for(var g=0; g<minOrder.length; g++){
    var mVal = minOrder[g];
    var courseList = groupsByMin[mVal];

    var ss = st ? fmt(st) : '--:--';
    var es = st ? fmt(addM(st, mVal)) : '--:--';

    var grpBox = document.createElement('div');
    grpBox.className = 'mgroup';

    var grpHdr = document.createElement('div');
    grpHdr.className = 'mgroup-hdr';
    grpHdr.innerHTML = 
      '<div class="mgroup-min">'+mVal+'<span> '+t.minUnit+'</span></div>'
      +'<div class="mgroup-times">'+ss+' → <b>'+es+'</b></div>';
    grpBox.appendChild(grpHdr);

    var itemsWrap = document.createElement('div');
    itemsWrap.className = 'mgroup-items';

    courseList.forEach(function(cc){
      var eff = getEffectivePrices(cc);
      var p1 = getArrItem(eff, 0) || 0;

      var isSelected = (selectedCourseData && ckey(selectedCourseData) === ckey(cc));

      var itemCard = document.createElement('div');
      itemCard.className = 'mitem' + (isSelected ? ' selected' : '');
      
      itemCard.innerHTML = 
        '<span class="c-badge '+nbadge(cc.name)+'">'+cc.name+'</span>'
        +'<div class="mitem-pr">'
          +'<span class="mitem-main">'+yen(p1)+'</span>'
        +'</div>';

      itemCard.onclick = function(){
        showRes(cc, ss, es);
        isResOpen = true;
        updateResDisplay();
        render();
      };

      itemsWrap.appendChild(itemCard);
    });

    grpBox.appendChild(itemsWrap);
    l.appendChild(grpBox);
  }
}

// 選択詳細ボックスの表示（各言語の項目名で表示）
function showRes(c, ss, es){
  if(!c) return;
  selectedCourseData = c;
  var t = I18N[currentLang];
  document.getElementById('rC').textContent = c.m + t.courseLabel + c.name;
  document.getElementById('rStart').textContent = ss || '--:--';
  document.getElementById('rEnd').textContent = es || '--:--';

  var eff = getEffectivePrices(c);
  var p1 = getArrItem(eff, 0) || 0;
  var unitVal = (c.m > 0 && p1 > 0) ? Math.round(p1 / c.m) : 0;

  function fmtPct(idx){
    if(c.percents && c.percents.length > idx){
      var pv = getArrItem(c.percents, idx);
      if(pv !== null && pv !== undefined && pv !== ''){
        var num = parseFloat(pv);
        if(!isNaN(num)) return '<span class="rp-pct-badge">('+num+'%)</span>';
      }
    }
    return '';
  }

  // 言語に応じた項目ラベルを取得
  var l1 = getActiveLabel('p1');
  var l2 = getActiveLabel('p2');
  var l3 = getActiveLabel('p3');
  var l4 = getActiveLabel('p4');
  var l5 = getActiveLabel('p5');
  var lUnit = getActiveLabel('unit');

  var rpBox = document.getElementById('resPrices');
  rpBox.innerHTML = 
    '<div class="rp"><div class="rp-lbl">'+l1+'</div><div class="rp-val hl1">'+yen(getArrItem(eff, 0))+'</div></div>'
    +'<div class="rp"><div class="rp-lbl">'+l2+fmtPct(1)+'</div><div class="rp-val hl2">'+yen(getArrItem(eff, 1))+'</div></div>'
    +'<div class="rp"><div class="rp-lbl">'+l3+fmtPct(2)+'</div><div class="rp-val hl3">'+yen(getArrItem(eff, 2))+'</div></div>'
    +'<div class="rp"><div class="rp-lbl">'+l4+fmtPct(3)+'</div><div class="rp-val">'+yen(getArrItem(eff, 3))+'</div></div>'
    +'<div class="rp"><div class="rp-lbl">'+l5+fmtPct(4)+'</div><div class="rp-val">'+yen(getArrItem(eff, 4))+'</div></div>'
    +'<div class="rp"><div class="rp-lbl">'+lUnit+'</div><div class="rp-val hl-unit">'+(unitVal ? '¥'+unitVal : '—')+'</div></div>';
}

function updateToggleBtnText(){

  var t = I18N[currentLang];

    tBtn.textContent = isResOpen ? ('▲ ' + t.close) : ('▼ ' + t.open);
  }

function updateResDisplay(){
  var resBox = document.getElementById('res');
  if(isResOpen){
    resBox.classList.add('open');
  } else {
    resBox.classList.remove('open');
  }
  updateToggleBtnText();
}

function sf(cat){
  currentFilter=cat;
  buildFilters();
  render();
}

function tick(){
  var t = I18N[currentLang];
  var now = new Date();
  var f = fmt(now);
  document.getElementById('liveTime').textContent = f;
  document.getElementById('nowTime').textContent = f;
  if(st){
    var diff = Math.floor((now - st) / 60000);
    document.getElementById('elapsed').textContent = diff + ' ' + t.minUnit;
  }
}

// 更新ボタン：5分単位の四捨五入（2捨3入）で開始時刻をセット
document.getElementById('btnUpd').onclick = function(){
  var now = new Date();
  st = getRoundedStartTime(now);
  document.getElementById('startTime').textContent = fmt(st);
  
  if(selectedCourseData){
    var ss = fmt(st);
    var es = fmt(addM(st, selectedCourseData.m));
    showRes(selectedCourseData, ss, es);
  }
  render();
  if(iv) clearInterval(iv);
  iv = setInterval(tick, 30000);
  tick();
};

  var curLabels = {
    p1: document.getElementById('cfgLabelP1').value.trim() || getActiveLabel('p1'),

    p3: document.getElementById('cfgLabelP3').value.trim() || getActiveLabel('p3'),
    p4: document.getElementById('cfgLabelP4').value.trim() || getActiveLabel('p4'),
    p5: document.getElementById('cfgLabelP5').value.trim() || getActiveLabel('p5'),
    unit: document.getElementById('cfgLabelUnit').value.trim() || getActiveLabel('unit')
  };

  var curPcts = {
    p2: document.getElementById('cfgPctP2').value.trim(),
    p3: document.getElementById('cfgPctP3').value.trim(),
    p4: document.getElementById('cfgPctP4').value.trim(),
    p5: document.getElementById('cfgPctP5').value.trim()
  };

  var items = courseEditList.querySelectorAll('.cfg-item');
  items.forEach(function(row){
    var labels = row.querySelectorAll('.cfg-sub-lbl');
    if(labels.length >= 6){
      labels[0].textContent = curLabels.p1;
      labels.textContent = curLabels.p2;
      labels.textContent = curLabels.p3;
      labels.textContent = curLabels.p4;
      labels.textContent = curLabels.p5;
      labels[5].textContent = curLabels.unit;
    }

    var m = parseInt(row.querySelector('.c-m').value) || 0;
    var p1 = parseInt(row.querySelector('.c-p1').value) || 0;

    var unitBox = row.querySelector('.cfg-unit-val');
    if(m > 0 && p1 > 0){
      unitBox.textContent = '¥' + Math.round(p1 / m);
    } else {
      unitBox.textContent = '—';
    }

    for(var i=2; i<=5; i++){
      var pctInput = row.querySelector('.c-pct' + i);
      var pInput = row.querySelector('.c-p' + i);
      var pctVal = curPcts['p' + i];

      pctInput.value = pctVal;
      if(pctVal !== '' && !isNaN(pctVal)){
        var calcAmt = Math.round(p1 * (parseFloat(pctVal) / 100));
        pInput.value = calcAmt;
        pInput.classList.add('is-auto');
        pInput.setAttribute('readonly', 'true');
      } else {
        pInput.classList.remove('is-auto');
        pInput.removeAttribute('readonly');
      }
    }
  });

  var t = I18N[currentLang];
  alert(t.applyDone);
}

    var f3 = getValAndClass(2);
    var f4 = getValAndClass(3);

    row.innerHTML = 
      '<div class="cfg-item-top">'
        +'<div class="c-field-group">'
          +'<div class="c-field-lbl">'+t.courseTime+'</div>'
          +'<div class="c-m-wrap">'
            +'<input type="number" class="c-m" value="'+(item.m||0)+'" placeholder="分" oninput="onCourseRowChange(this)">'
            +'<span style="font-size:12px;color:#8e8e93">'+t.minUnit+'</span>'
          +'</div>'
        +'</div>'
        +'<div class="c-field-group c-name-wrap">'
          +'<div class="c-field-lbl">'+t.courseName+'</div>'
          +'<input type="text" class="c-name" value="'+(item.name||'')+'" placeholder="Name">'
        +'</div>'
        +'<button type="button" class="btn-del" data-idx="'+idx+'">'+t.delete+'</button>'
      +'</div>'
      +'<div class="cfg-item-fields">'
        +'<div class="cfg-field">'
          +'<div class="cfg-sub-lbl">'+curLabels.p1+'</div>'
          +'<div style="height:23px;margin-bottom:2px"></div>'
          +'<input type="number" class="cfg-sub-input c-p1" value="'+(p1||'')+'" oninput="onCourseRowChange(this)">'
        +'</div>'
        +'<div class="cfg-field">'
          +'<div class="cfg-sub-lbl">'+curLabels.p2+'</div>'
          +'<div class="pct-input-wrap"><input type="number" class="cfg-pct-input c-pct2" value="'+(getArrItem(pct,1)!==null&&getArrItem(pct,1)!==undefined?getArrItem(pct,1):'')+'" placeholder="%" step="any" oninput="onCourseRowChange(this)"><span class="pct-unit">%</span></div>'
          +'<input type="number" class="cfg-sub-input c-p2 '+(f2.isAuto?'is-auto':'')+'" value="'+f2.val+'" '+(f2.isAuto?'readonly':'')+'>'
        +'</div>'
        +'<div class="cfg-field">'
          +'<div class="cfg-sub-lbl">'+curLabels.p3+'</div>'
          +'<div class="pct-input-wrap"><input type="number" class="cfg-pct-input c-pct3" value="'+(getArrItem(pct,2)!==null&&getArrItem(pct,2)!==undefined?getArrItem(pct,2):'')+'" placeholder="%" step="any" oninput="onCourseRowChange(this)"><span class="pct-unit">%</span></div>'
          +'<input type="number" class="cfg-sub-input c-p3 '+(f3.isAuto?'is-auto':'')+'" value="'+f3.val+'" '+(f3.isAuto?'readonly':'')+'>'
        +'</div>'
        +'<div class="cfg-field">'
          +'<div class="cfg-sub-lbl">'+curLabels.p4+'</div>'
          +'<div class="pct-input-wrap"><input type="number" class="cfg-pct-input c-pct4" value="'+(getArrItem(pct,3)!==null&&getArrItem(pct,3)!==undefined?getArrItem(pct,3):'')+'" placeholder="%" step="any" oninput="onCourseRowChange(this)"><span class="pct-unit">%</span></div>'
          +'<input type="number" class="cfg-sub-input c-p4 '+(f4.isAuto?'is-auto':'')+'" value="'+f4.val+'" '+(f4.isAuto?'readonly':'')+'>'
        +'</div>'
        +'<div class="cfg-field">'
          +'<div class="cfg-sub-lbl">'+curLabels.p5+'</div>'
          +'<div class="pct-input-wrap"><input type="number" class="cfg-pct-input c-pct5" value="'+(getArrItem(pct,4)!==null&&getArrItem(pct,4)!==undefined?getArrItem(pct,4):'')+'" placeholder="%" step="any" oninput="onCourseRowChange(this)"><span class="pct-unit">%</span></div>'
          +'<input type="number" class="cfg-sub-input c-p5 '+(f5.isAuto?'is-auto':'')+'" value="'+f5.val+'" '+(f5.isAuto?'readonly':'')+'>'
        +'</div>'

      var delIdx = parseInt(this.getAttribute('data-idx'));
      var currentList = getEditCourses();

    };

function onCourseRowChange(inputElem){
  var row = inputElem.closest('.cfg-item');
  var m = parseInt(row.querySelector('.c-m').value) || 0;
  var p1 = parseInt(row.querySelector('.c-p1').value) || 0;

  var unitBox = row.querySelector('.cfg-unit-val');
  if(m > 0 && p1 > 0){
    unitBox.textContent = '¥' + Math.round(p1 / m);
  } else {
    unitBox.textContent = '—';
  }

  for(var i=2; i<=5; i++){
    var pctInput = row.querySelector('.c-pct' + i);
    var pInput = row.querySelector('.c-p' + i);
    var pctVal = pctInput.value.trim();

    if(pctVal !== '' && !isNaN(pctVal)){
      var calcAmt = Math.round(p1 * (parseFloat(pctVal) / 100));
      pInput.value = calcAmt;
      pInput.classList.add('is-auto');
      pInput.setAttribute('readonly', 'true');
    } else {
      pInput.classList.remove('is-auto');
      pInput.removeAttribute('readonly');
    }
  }
}

function getEditCourses(){
  var items = courseEditList.querySelectorAll('.cfg-item');
  var list = [];
  items.forEach(function(el){
    var m = parseInt(el.querySelector('.c-m').value) || 0;
    var name = el.querySelector('.c-name').value.trim() || 'その他';
    var p1 = parseInt(el.querySelector('.c-p1').value) || 0;

    var prices = [p1];
    var percents = [null];

    for(var i=2; i<=5; i++){
      var pctVal = el.querySelector('.c-pct' + i).value.trim();
      var pVal = el.querySelector('.c-p' + i).value.trim();

      if(pctVal !== '' && !isNaN(pctVal)){
        percents.push(parseFloat(pctVal));
        prices.push(Math.round(p1 * (parseFloat(pctVal) / 100)));
      } else {
        percents.push(null);
        prices.push(pVal !== '' ? parseInt(pVal) : null);
      }
    }

    list.push({
      m: m,
      name: name,
      prices: prices,
      percents: percents
    });
  });
  list.sort(function(a,b){ return a.m - b.m; });
  return list;
}

  };

  };
